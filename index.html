<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechLab Store</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="./public/logo.png" />
    <meta property="og:title" content="TechLab Store" />
    <meta
      property="og:description"
      content="TechLab - Desenvolvimento de bots, sites e automações para sua comunidade ou projeto!"
    />
    <meta
      property="og:image"
      content="https://techlabstore.vercel.app/logo.png"
    />
    <meta property="og:url" content="https://techlabstore.vercel.app/" />
    <meta property="og:type" content="website" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r121/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
  </head>
  <body id="background" class="max-h">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      VANTA.NET({
        el: "#background",
        mouseControls: true,
        touchControls: true,
        gyroControls: false,
        minHeight: 200.0,
        minWidth: 200.0,
        scale: 1.0,
        scaleMobile: 1.0,
        color: 0x505050,
        backgroundColor: 0xf0f0f,
      });
    </script>
  </body>
</html>
